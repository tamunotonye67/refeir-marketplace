<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%" fill="none">
  <!-- Refeir Clean Flat 2D Business Deal & Negotiation SVG (Zero Black, Warm & High Contrast) -->
  <defs>
    <!-- Left Person: Royal Azure & Sky Blue Jacket -->
    <linearGradient id="clientJacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>

    <!-- Right Person: Leaf & Emerald Green Jacket -->
    <linearGradient id="partnerJacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A3E635" />
      <stop offset="100%" stopColor="#2E7D32" />
    </linearGradient>

    <!-- Table Surface: Warm Rich Wood (Ochre & Honey Amber) -->
    <linearGradient id="woodTableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#D97706" />
      <stop offset="50%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <!-- Warm Golden Accents & Terracotta Pot -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F6B21A" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <!-- Laptop Screen Glow (Soft Mint / Light Leaf Green) -->
    <linearGradient id="screenGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E8F9D6" />
      <stop offset="100%" stopColor="#CEF5A0" />
    </linearGradient>

    <!-- Leaves Gradient -->
    <linearGradient id="treeLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A3E635" />
      <stop offset="100%" stopColor="#2E7D32" />
    </linearGradient>
  </defs>

  <!-- Ground subtle base shadow -->
  <ellipse cx="230" cy="256" rx="180" ry="8" fill="rgba(18, 43, 26, 0.25)" />

  <!-- Background Growth Trajectory Graphic (Harmonic upward arc) -->
  <path d="M 90 205 C 160 145, 250 95, 380 65" stroke="rgba(163, 230, 53, 0.4)" strokeWidth="2" strokeDasharray="5 5" fill="none" />
  <circle cx="380" cy="65" r="4.5" fill="#66BB2A" />
  <circle cx="380" cy="65" r="2" fill="#FFFFFF" />

  <!-- ========================================== -->
  <!-- LEFT PERSON: Enterprise Client (Azure Blue) -->
  <!-- ========================================== -->
  <g id="client-figure">
    <!-- Ergonomic Office Chair: Deep Forest Green (no black) -->
    <rect x="58" y="110" width="46" height="64" rx="8" fill="#153823" stroke="rgba(163, 230, 53, 0.3)" strokeWidth="1.5" />
    <path d="M 64 172 L 52 192 C 50 195 54 198 57 196 L 68 178 Z" fill="#122E1D" />
    <path d="M 81 174 L 81 250" stroke="#122E1D" strokeWidth="4.5" strokeLinecap="round" />
    <path d="M 98 172 L 110 192 C 112 195 108 198 105 196 L 94 178 Z" fill="#122E1D" />

    <!-- Head & Hair (Warm Mocha & Rich Dark Chestnut) -->
    <ellipse cx="106" cy="80" rx="14" ry="15" fill="#6B4125" />
    <path d="M 94 78 C 94 66, 106 63, 117 67 C 121 71, 120 79, 117 83 C 111 77, 102 75, 94 78 Z" fill="#382112" />
    <!-- Neck -->
    <rect x="102" y="93" width="8" height="10" fill="#6B4125" />

    <!-- Torso: Azure Blue Jacket -->
    <path d="M 90 102 C 86 110, 84 150, 84 174 L 132 174 C 132 150, 130 110, 126 102 C 120 98, 96 98, 90 102 Z" fill="url(#clientJacketGrad)" />
    <!-- Pure White Collar & Golden Tie -->
    <polygon points="102,102 110,102 106,118" fill="#F8FAFC" />
    <polygon points="105,108 107,108 108,132 104,132" fill="#F6B21A" />

    <!-- Arm reaching forward across the table -->
    <path d="M 120 114 C 138 124, 168 136, 202 140 L 200 152 C 160 148, 132 134, 114 126 Z" fill="#0284C7" />
    <!-- Hand on table (Warm Mocha) -->
    <ellipse cx="206" cy="146" rx="7" ry="5" fill="#6B4125" />
  </g>

  <!-- ========================================== -->
  <!-- RIGHT PERSON: Lead Architect (Emerald Green) -->
  <!-- ========================================== -->
  <g id="partner-figure">
    <!-- Ergonomic Office Chair: Deep Forest Green (no black) -->
    <rect x="356" y="110" width="46" height="64" rx="8" fill="#153823" stroke="rgba(163, 230, 53, 0.3)" strokeWidth="1.5" />
    <path d="M 362 172 L 350 192 C 348 195 352 198 355 196 L 366 178 Z" fill="#122E1D" />
    <path d="M 379 174 L 379 250" stroke="#122E1D" strokeWidth="4.5" strokeLinecap="round" />
    <path d="M 396 172 L 408 192 C 410 195 406 198 403 196 L 392 178 Z" fill="#122E1D" />

    <!-- Head & Hair (Warm Mocha & Rich Dark Chestnut Bun) -->
    <ellipse cx="354" cy="80" rx="14" ry="15" fill="#6B4125" />
    <circle cx="354" cy="65" r="7.5" fill="#382112" />
    <path d="M 342 78 C 342 66, 354 63, 365 67 C 369 71, 368 79, 365 83 C 359 77, 350 75, 342 78 Z" fill="#382112" />
    <!-- Neck -->
    <rect x="350" y="93" width="8" height="10" fill="#6B4125" />

    <!-- Torso: Smart Emerald Green Jacket -->
    <path d="M 338 102 C 334 110, 332 150, 332 174 L 380 174 C 380 150, 378 110, 374 102 C 368 98, 344 98, 338 102 Z" fill="url(#partnerJacketGrad)" />
    <!-- Pure White Collar -->
    <polygon points="350,102 358,102 354,118" fill="#F8FAFC" />

    <!-- Arm reaching forward to shake hands -->
    <path d="M 340 116 C 320 126, 290 138, 256 142 L 258 154 C 298 150, 326 136, 346 128 Z" fill="#256629" />
    <!-- Hand (Warm Mocha) -->
    <ellipse cx="252" cy="147" rx="7" ry="5" fill="#6B4125" />
  </g>

  <!-- ========================================== -->
  <!-- CENTER HANDSHAKE CLASP -->
  <!-- ========================================== -->
  <g id="handshake-clasp">
    <!-- Warm Interlocked Hands -->
    <ellipse cx="229" cy="147" rx="14" ry="9" fill="#58351E" stroke="#F6B21A" strokeWidth="1.8" />
    <path d="M 221 144 Q 229 152 237 144" stroke="#FFFFFF" strokeWidth="1.8" strokeLinecap="round" fill="none" />

    <!-- Radiant Agreement Glow Ring -->
    <circle cx="229" cy="147" r="22" stroke="rgba(246, 178, 26, 0.55)" strokeWidth="1.5" strokeDasharray="4 4" fill="none" />
  </g>

  <!-- ========================================== -->
  <!-- MODERN WOODEN CONFERENCE TABLE & ITEMS -->
  <!-- ========================================== -->
  <g id="conference-table">
    <!-- Warm Rich Wood Table Surface (No black) -->
    <rect x="110" y="158" width="240" height="10" rx="5" fill="url(#woodTableGrad)" stroke="#FDE047" strokeWidth="1" />
    
    <!-- Desk Legs: Deep Forest Green -->
    <line x1="130" y1="168" x2="130" y2="250" stroke="#122E1D" strokeWidth="4.5" strokeLinecap="round" />
    <line x1="330" y1="168" x2="330" y2="250" stroke="#122E1D" strokeWidth="4.5" strokeLinecap="round" />
    <!-- Crossbar -->
    <line x1="130" y1="210" x2="330" y2="210" stroke="#122E1D" strokeWidth="2.5" />

    <!-- LAPTOP: Slate Grey with Mint Green Glowing Screen (like footer) -->
    <polygon points="135,160 178,160 174,163 139,163" fill="#64748B" />
    <polygon points="142,160 150,132 180,132 176,160" fill="#1E293B" stroke="#38BDF8" strokeWidth="1" />
    <polygon points="144,158 151,134 178,134 174,158" fill="url(#screenGlowGrad)" />
    <!-- Code lines on screen -->
    <line x1="153" y1="140" x2="168" y2="140" stroke="#2E7D32" strokeWidth="1.5" strokeLinecap="round" />
    <line x1="152" y1="144" x2="173" y2="144" stroke="#66BB2A" strokeWidth="1.5" strokeLinecap="round" />
    <line x1="151" y1="148" x2="165" y2="148" stroke="#4CAF50" strokeWidth="1.5" strokeLinecap="round" />

    <!-- CONTRACT DOCUMENT WITH GOLD SEAL -->
    <rect x="278" y="148" width="30" height="18" rx="2.5" fill="#FFFFFF" stroke="#CBD5E1" strokeWidth="1" transform="rotate(-6 278 148)" />
    <line x1="283" y1="154" x2="301" y2="152" stroke="#94A3B8" strokeWidth="1.5" strokeLinecap="round" />
    <line x1="284" y1="159" x2="298" y2="157" stroke="#94A3B8" strokeWidth="1.5" strokeLinecap="round" />
    <!-- Gold Wax Escrow Seal -->
    <circle cx="302" cy="158" r="4" fill="url(#potGrad)" />

    <!-- Ceramic Coffee Mug on Desk (Pure White with green emblem) -->
    <rect x="195" y="150" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#CBD5E1" strokeWidth="1" />
    <path d="M 205 153 C 208 153, 208 157, 205 157" stroke="#CBD5E1" strokeWidth="1" fill="none" />
    <line x1="199" y1="153" x2="202" y2="157" stroke="#66BB2A" strokeWidth="1.5" />
  </g>

  <!-- Potted Growth Plant on Left (Matching Footer Pottery & Leaves) -->
  <g id="growth-plant" transform="translate(18, 168)">
    <!-- Terracotta Ochre Pot -->
    <path d="M 14 42 L 18 72 C 19 74 33 74 34 72 L 38 42 Z" fill="url(#potGrad)" />
    <rect x="12" y="38" width="28" height="5" rx="2.5" fill="#C98405" />

    <!-- Lush Flat 2D Leaves -->
    <path d="M 26 38 C 16 22, 10 18, 16 8 C 24 13, 26 26, 26 38 Z" fill="#2E7D32" />
    <path d="M 26 38 C 34 18, 44 16, 40 6 C 30 11, 26 25, 26 38 Z" fill="#66BB2A" />
    <path d="M 26 38 C 23 16, 30 5, 28 0 C 33 7, 30 24, 26 38 Z" fill="#A3E635" />
  </g>
</svg>
