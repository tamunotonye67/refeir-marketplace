<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 290" width="100%" height="100%" fill="none">
  <!-- Refeir High-Contrast Modern 2D Flat Business Deal & Negotiation SVG Illustration -->
  <defs>
    <!-- Crisp High-Contrast Gradients -->
    <!-- Client (Left): Bright Electric Cyan / Royal Azure Suit -->
    <linearGradient id="clientSuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>

    <!-- Partner (Right): Radiant Vibrant Lime & Emerald Green Blazer -->
    <linearGradient id="partnerSuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A3E635" />
      <stop offset="100%" stopColor="#4ADE80" />
    </linearGradient>

    <!-- Warm Golden Amber Tie & Accents -->
    <linearGradient id="goldAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>

    <!-- Sleek Conference Table: Bright Crisp Slate Surface for High Contrast -->
    <linearGradient id="brightTableTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#E2E8F0" />
      <stop offset="50%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#E2E8F0" />
    </linearGradient>

    <!-- Laptop Glowing Screen -->
    <linearGradient id="brightLaptopScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#818CF8" />
    </linearGradient>

    <!-- Ambient Aura behind the scene -->
    <radialGradient id="sceneAuraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#10B981" stopOpacity="0.30" />
      <stop offset="60%" stopColor="#38BDF8" stopOpacity="0.15" />
      <stop offset="100%" stopColor="#091D12" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Radiant Backlight Aura (Illuminates the entire scene against dark website background) -->
  <ellipse cx="230" cy="150" rx="195" ry="110" fill="url(#sceneAuraGrad)" />

  <!-- Ground subtle shadow -->
  <ellipse cx="230" cy="265" rx="190" ry="10" fill="rgba(0, 0, 0, 0.45)" />

  <!-- Subtle Architecture Backdrop (Thin, luminous glowing guidelines) -->
  <g stroke="rgba(255, 255, 255, 0.12)" strokeWidth="1.2">
    <line x1="85" y1="20" x2="85" y2="185" />
    <line x1="230" y1="20" x2="230" y2="155" strokeDasharray="4 6" />
    <line x1="375" y1="20" x2="375" y2="185" />
    <line x1="40" y1="95" x2="420" y2="95" strokeDasharray="3 4" />
  </g>

  <!-- Upward Trajectory Arc (Bright Lime Green) -->
  <path d="M 70 215 C 135 145, 230 85, 385 68" stroke="#A3E635" strokeWidth="2" strokeDasharray="6 6" opacity="0.85" />
  <circle cx="385" cy="68" r="5" fill="#A3E635" />
  <circle cx="385" cy="68" r="2.5" fill="#FFFFFF" />

  <!-- ========================================== -->
  <!-- LEFT FIGURE: Enterprise Client (Bright Cyan Suit) -->
  <!-- ========================================== -->
  <g id="client-figure">
    <!-- Chair Back: Crisp Slate with Outline -->
    <rect x="54" y="110" width="46" height="68" rx="10" fill="#1E293B" stroke="rgba(56, 189, 248, 0.4)" strokeWidth="2" />
    <line x1="77" y1="178" x2="77" y2="252" stroke="#0F172A" strokeWidth="5" strokeLinecap="round" />
    <line x1="60" y1="252" x2="94" y2="252" stroke="#0F172A" strokeWidth="3.5" strokeLinecap="round" />

    <!-- Head & Hair -->
    <ellipse cx="104" cy="82" rx="15" ry="17" fill="#8D5B36" stroke="#BA7A48" strokeWidth="1" />
    <path d="M 90 80 C 90 65, 104 62, 117 66 C 122 71, 121 79, 118 84 C 111 77, 98 75, 90 80 Z" fill="#1E140F" />
    <!-- Neck -->
    <rect x="100" y="97" width="9" height="11" fill="#8D5B36" />

    <!-- Torso / Bright Cyan Suit -->
    <path d="M 84 108 C 80 118, 77 160, 77 186 L 131 186 C 131 160, 128 118, 124 108 C 117 104, 91 104, 84 108 Z" fill="url(#clientSuitGrad)" />
    
    <!-- Crisp Pure White Shirt & Bright Golden Tie -->
    <polygon points="99,108 109,108 104,126" fill="#FFFFFF" />
    <polygon points="103,115 105,115 106,140 102,140" fill="url(#goldAccentGrad)" />

    <!-- Right Arm (reaching across table) -->
    <path d="M 120 124 C 140 132, 172 144, 206 148 L 204 162 C 164 157, 134 144, 116 137 Z" fill="url(#clientSuitGrad)" />
    <!-- Hand -->
    <ellipse cx="210" cy="154" rx="8" ry="6" fill="#8D5B36" stroke="#BA7A48" strokeWidth="1" />
  </g>

  <!-- ========================================== -->
  <!-- RIGHT FIGURE: African Partner / Architect (Bright Lime Blazer) -->
  <!-- ========================================== -->
  <g id="partner-figure">
    <!-- Chair Back: Crisp Slate with Outline -->
    <rect x="360" y="110" width="46" height="68" rx="10" fill="#1E293B" stroke="rgba(163, 230, 53, 0.4)" strokeWidth="2" />
    <line x1="383" y1="178" x2="383" y2="252" stroke="#0F172A" strokeWidth="5" strokeLinecap="round" />
    <line x1="366" y1="252" x2="400" y2="252" stroke="#0F172A" strokeWidth="3.5" strokeLinecap="round" />

    <!-- Head & Hair (stylish bun) -->
    <ellipse cx="356" cy="82" rx="15" ry="17" fill="#8D5B36" stroke="#BA7A48" strokeWidth="1" />
    <circle cx="356" cy="65" r="9" fill="#1E140F" />
    <path d="M 342 80 C 342 66, 358 63, 370 67 C 373 72, 372 81, 369 85 C 362 77, 351 76, 342 80 Z" fill="#1E140F" />
    <!-- Neck -->
    <rect x="351" y="97" width="9" height="11" fill="#8D5B36" />

    <!-- Torso / Radiant Lime & Green Blazer -->
    <path d="M 336 108 C 332 118, 329 160, 329 186 L 383 186 C 383 160, 380 118, 376 108 C 369 104, 343 104, 336 108 Z" fill="url(#partnerSuitGrad)" />
    
    <!-- Pure White Inner Blouse with Pearl Detail -->
    <polygon points="351,108 361,108 356,128" fill="#FFFFFF" />
    <circle cx="356" cy="118" r="2.5" fill="#E2E8F0" />

    <!-- Left Arm (reaching forward to shake hands) -->
    <path d="M 340 126 C 318 134, 286 146, 252 149 L 254 163 C 292 160, 324 146, 344 139 Z" fill="url(#partnerSuitGrad)" />
    <!-- Hand -->
    <ellipse cx="248" cy="155" rx="8" ry="6" fill="#8D5B36" stroke="#BA7A48" strokeWidth="1" />
  </g>

  <!-- ========================================== -->
  <!-- CENTER HANDSHAKE CLASP & GLOWING SEAL -->
  <!-- ========================================== -->
  <g id="handshake-clasp">
    <!-- Firm Interlocked Hands with Warm Amber Glow -->
    <ellipse cx="229" cy="154" rx="16" ry="11" fill="#784725" stroke="#FDE047" strokeWidth="2.5" />
    <path d="M 220 152 Q 229 160 238 152" stroke="#FFFFFF" strokeWidth="2" strokeLinecap="round" fill="none" />

    <!-- Concentric Golden Agreement Halo -->
    <circle cx="229" cy="154" r="26" stroke="#F59E0B" strokeWidth="2" strokeDasharray="5 5" fill="none" />
    <circle cx="229" cy="154" r="34" stroke="rgba(253, 224, 71, 0.35)" strokeWidth="1.2" fill="none" />
  </g>

  <!-- ========================================== -->
  <!-- HIGH-CONTRAST MODERN CONFERENCE DESK -->
  <!-- ========================================== -->
  <g id="conference-table">
    <!-- Desk Surface: Crisp Solid White / Light Slate (Stands out brilliantly on dark background) -->
    <rect x="105" y="166" width="250" height="14" rx="7" fill="url(#brightTableTopGrad)" stroke="#38BDF8" strokeWidth="1.5" />
    
    <!-- Desk Legs: Solid Clean Silver-Slate Legs -->
    <line x1="128" y1="180" x2="128" y2="258" stroke="#94A3B8" strokeWidth="6" strokeLinecap="round" />
    <line x1="332" y1="180" x2="332" y2="258" stroke="#94A3B8" strokeWidth="6" strokeLinecap="round" />
    <!-- Desk Crossbar -->
    <line x1="128" y1="222" x2="332" y2="222" stroke="#64748B" strokeWidth="3" />

    <!-- CLIENT LAPTOP: Sleek Dark Slate with Glowing Cyan Screen -->
    <polygon points="132,168 174,168 170,173 135,173" fill="#334155" />
    <polygon points="138,168 147,138 178,138 173,168" fill="#0F172A" stroke="#38BDF8" strokeWidth="1.2" />
    <polygon points="140,166 148,140 176,140 172,166" fill="url(#brightLaptopScreenGrad)" />
    <!-- Code / Architecture Lines on Screen -->
    <line x1="151" y1="147" x2="167" y2="147" stroke="#FFFFFF" strokeWidth="1.8" strokeLinecap="round" />
    <line x1="151" y1="153" x2="171" y2="153" stroke="#FDE047" strokeWidth="1.8" strokeLinecap="round" />
    <line x1="151" y1="159" x2="164" y2="159" stroke="#FFFFFF" strokeWidth="1.8" strokeLinecap="round" />

    <!-- CONTRACT DOCUMENT WITH GOLD ESCROW SEAL -->
    <rect x="282" y="154" width="32" height="19" rx="3" fill="#FFFFFF" stroke="#0F172A" strokeWidth="1.5" transform="rotate(-5 282 154)" />
    <line x1="287" y1="161" x2="305" y2="159" stroke="#64748B" strokeWidth="2" strokeLinecap="round" />
    <line x1="287" y1="166" x2="301" y2="165" stroke="#64748B" strokeWidth="2" strokeLinecap="round" />
    <!-- Wax Escrow Seal: Bold Amber & Gold -->
    <circle cx="306" cy="165" r="4.5" fill="url(#goldAccentGrad)" stroke="#92400E" strokeWidth="1" />

    <!-- Ceramic Coffee Mug (Clean Pure White with Green Accent Line) -->
    <rect x="194" y="157" width="11" height="11" rx="3" fill="#FFFFFF" stroke="#CBD5E1" strokeWidth="1.2" />
    <path d="M 205 159 C 208 159, 208 164, 205 164" stroke="#CBD5E1" strokeWidth="1.2" fill="none" />
    <line x1="198" y1="161" x2="201" y2="165" stroke="#10B981" strokeWidth="2" strokeLinecap="round" />
  </g>

  <!-- Potted Office Plant for Warmth & Pop of Green (Left) -->
  <g id="office-plant" transform="translate(18, 175)">
    <!-- Terracotta / Bright Gold Pot -->
    <path d="M 12 42 L 16 74 C 17 76 31 76 32 74 L 36 42 Z" fill="url(#goldAccentGrad)" stroke="#B45309" strokeWidth="1.2" />
    <rect x="11" y="38" width="26" height="5" rx="2.5" fill="#FDE047" />
    <!-- Vibrant Green Leaves -->
    <path d="M 24 38 C 14 24, 6 20, 10 9 C 20 14, 24 28, 24 38 Z" fill="#22C55E" />
    <path d="M 24 38 C 32 20, 42 18, 39 7 C 29 13, 25 27, 24 38 Z" fill="#4ADE80" />
    <path d="M 24 38 C 21 16, 28 5, 25 0 C 30 7, 27 24, 24 38 Z" fill="#A3E635" />
  </g>
</svg>
