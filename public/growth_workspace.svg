<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="100%" fill="none">
  <!-- Flat 2D Talent & Career Growth Illustration for Refeir Footer -->
  <defs>
    <linearGradient id="treeLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A3E635" />
      <stop offset="100%" stopColor="#2E7D32" />
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#F6B21A" />
      <stop offset="100%" stopColor="#D99709" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#1C3827" />
      <stop offset="100%" stopColor="#2A4D37" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E8F9D6" />
      <stop offset="100%" stopColor="#CEF5A0" />
    </linearGradient>
  </defs>

  <!-- Ground / Baseline subtle shadow -->
  <ellipse cx="180" cy="198" rx="145" ry="7" fill="rgba(18, 43, 26, 0.08)" />

  <!-- LEFT SIDE: Thriving Growth Tree / Large Plant in Ceramic Pot -->
  <g id="growth-tree">
    <!-- Ceramic Terracotta / Ochre Pot -->
    <path d="M 52 165 L 56 195 C 57 197 73 197 74 195 L 78 165 Z" fill="url(#potGrad)" />
    <rect x="50" y="161" width="30" height="5" rx="2.5" fill="#C98405" />

    <!-- Tree Stems & Branches -->
    <path d="M 65 161 C 65 140, 60 115, 62 85" stroke="#4A3420" strokeWidth="4.5" strokeLinecap="round" />
    <path d="M 64 135 C 75 125, 85 128, 92 118" stroke="#4A3420" strokeWidth="3.5" strokeLinecap="round" />
    <path d="M 63 115 C 50 105, 42 108, 35 98" stroke="#4A3420" strokeWidth="3" strokeLinecap="round" />
    <path d="M 63 95 C 72 85, 78 88, 86 78" stroke="#4A3420" strokeWidth="2.8" strokeLinecap="round" />

    <!-- Lush Flat 2D Leaves (representing growth) -->
    <!-- Top Canopy Leaves -->
    <path d="M 62 85 C 55 65, 65 50, 62 45 C 75 52, 75 75, 62 85 Z" fill="url(#treeLeafGrad)" />
    <path d="M 62 65 C 45 60, 42 45, 48 38 C 60 42, 62 55, 62 65 Z" fill="#66BB2A" />
    <path d="M 62 65 C 78 58, 85 45, 76 38 C 65 44, 62 56, 62 65 Z" fill="#A3E635" />

    <!-- Right Branch Leaves -->
    <path d="M 92 118 C 105 110, 112 118, 108 126 C 98 126, 92 122, 92 118 Z" fill="#66BB2A" />
    <path d="M 92 118 C 100 102, 112 105, 108 114 C 100 118, 95 118, 92 118 Z" fill="#4CAF50" />
    <path d="M 86 78 C 98 68, 106 75, 102 84 C 92 84, 88 80, 86 78 Z" fill="url(#treeLeafGrad)" />

    <!-- Left Branch Leaves -->
    <path d="M 35 98 C 22 92, 16 100, 22 108 C 30 106, 35 102, 35 98 Z" fill="#2E7D32" />
    <path d="M 35 98 C 26 84, 15 88, 20 96 C 28 98, 33 98, 35 98 Z" fill="#66BB2A" />

    <!-- Mid & Lower Accent Leaves -->
    <path d="M 64 145 C 50 140, 48 150, 55 155 C 62 153, 64 148, 64 145 Z" fill="#388E3C" />
    <path d="M 65 142 C 78 138, 82 148, 75 152 C 68 150, 65 145, 65 142 Z" fill="#A3E635" />

    <!-- Upward Growth Accent Ring -->
    <circle cx="62" cy="35" r="4" fill="#66BB2A" />
    <circle cx="85" cy="32" r="2.5" fill="#A3E635" />
    <circle cx="40" cy="34" r="2.5" fill="#4CAF50" />
  </g>

  <!-- CENTER & RIGHT: Modern Desk, Chair & Professional Talent -->
  <g id="talent-workspace">
    <!-- Ergonomic Office Chair Back & Base -->
    <rect x="228" y="112" width="46" height="58" rx="8" fill="#152E20" />
    <path d="M 234 168 L 222 188 C 220 191 224 194 227 192 L 238 174 Z" fill="#102419" />
    <path d="M 251 170 L 251 195" stroke="#102419" strokeWidth="4.5" strokeLinecap="round" />
    <path d="M 264 168 L 276 188 C 278 191 274 194 271 192 L 260 174 Z" fill="#102419" />
    <circle cx="222" cy="193" r="2.5" fill="#0A1810" />
    <circle cx="251" cy="195" r="2.5" fill="#0A1810" />
    <circle cx="276" cy="193" r="2.5" fill="#0A1810" />

    <!-- Person (Professional Talent) -->
    <!-- Head & Hair (clean modern silhouette) -->
    <ellipse cx="242" cy="78" rx="13" ry="14" fill="#6B4125" />
    <!-- Hair / Styling -->
    <path d="M 230 76 C 230 65, 242 62, 253 66 C 257 70, 256 78, 253 82 C 248 76, 238 74, 230 76 Z" fill="#26170F" />
    <circle cx="240" cy="64" r="7" fill="#26170F" /> <!-- Neat hair bun / texture -->

    <!-- Neck -->
    <rect x="238" y="90" width="8" height="9" fill="#6B4125" />

    <!-- Torso / Smart Casual Green Jacket -->
    <path d="M 226 98 C 224 105, 222 135, 222 152 L 262 152 C 262 135, 260 105, 258 98 C 252 95, 232 95, 226 98 Z" fill="#2E7D32" />
    <!-- Collar / Inner Top -->
    <polygon points="238,98 246,98 242,112" fill="#E8F5E9" />

    <!-- Arm reaching forward to Laptop Keyboard -->
    <path d="M 230 106 C 222 120, 210 132, 195 136 L 202 142 C 215 138, 228 126, 236 114 Z" fill="#256629" />
    <!-- Hand on keyboard -->
    <ellipse cx="192" cy="138" rx="5.5" ry="3.5" fill="#6B4125" />

    <!-- Flat Minimalist Desk Surface -->
    <rect x="135" y="138" width="155" height="7" rx="3.5" fill="url(#deskGrad)" />
    <!-- Desk Legs -->
    <line x1="145" y1="145" x2="145" y2="195" stroke="#1A3324" strokeWidth="4" strokeLinecap="round" />
    <line x1="282" y1="145" x2="282" y2="195" stroke="#1A3324" strokeWidth="4" strokeLinecap="round" />
    <!-- Desk Crossbar -->
    <line x1="145" y1="172" x2="282" y2="172" stroke="#1A3324" strokeWidth="2.5" />

    <!-- Slim Modern Laptop -->
    <!-- Base -->
    <polygon points="172,140 216,140 212,143 176,143" fill="#64748B" />
    <!-- Screen -->
    <polygon points="178,140 186,112 216,112 212,140" fill="#0F172A" />
    <!-- Screen Display Glow (Refeir Vibrant Soft Green Glow) -->
    <polygon points="180,138 187,114 214,114 210,138" fill="url(#screenGlow)" />
    <!-- Small code lines on screen -->
    <line x1="189" y1="120" x2="204" y2="120" stroke="#2E7D32" strokeWidth="1.5" strokeLinecap="round" />
    <line x1="188" y1="124" x2="209" y2="124" stroke="#66BB2A" strokeWidth="1.5" strokeLinecap="round" />
    <line x1="187" y1="128" x2="201" y2="128" stroke="#4CAF50" strokeWidth="1.5" strokeLinecap="round" />

    <!-- Ceramic Coffee Mug on Desk with green emblem -->
    <rect x="150" y="130" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#CBD5E1" strokeWidth="1" />
    <path d="M 160 133 C 163 133, 163 137, 160 137" stroke="#CBD5E1" strokeWidth="1" fill="none" />
    <line x1="154" y1="133" x2="157" y2="137" stroke="#66BB2A" strokeWidth="1.5" />

    <!-- Small Succulent on Desk -->
    <path d="M 268 134 L 274 134 L 273 140 L 269 140 Z" fill="#E2E8F0" />
    <circle cx="271" cy="132" r="3" fill="#66BB2A" />
    <circle cx="269" cy="133" r="2.5" fill="#A3E635" />
    <circle cx="273" cy="133" r="2.5" fill="#4CAF50" />
  </g>

  <!-- Background Growth Trajectory Graphic (Harmonic upward arc) -->
  <path d="M 120 185 C 160 155, 230 110, 310 85" stroke="rgba(102, 187, 42, 0.22)" strokeWidth="2" strokeDasharray="5 5" fill="none" />
  <circle cx="310" cy="85" r="4.5" fill="#66BB2A" />
  <circle cx="310" cy="85" r="2" fill="#FFFFFF" />
</svg>
